[package]
name = "clippy-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clippy-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clippy-core = { path = "../clippy-core" }
clippy-proto = { path = "../clippy-proto" }
windows.workspace = true
# Loopback-only HTTPS to League's Live Client Data API (self-signed); schannel,
# as in clippy-ui.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[build-dependencies]
embed-resource = "3.0.11"
