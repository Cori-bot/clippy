<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clippy</title>
    <!-- The SDK's component CSS is emitted before Tailwind's own, which would
         declare its `components` layer first and let the preflight reset in
         `base` override every component. Fixing the order here, ahead of both. -->
    <style>
      @layer theme, base, components, utilities;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
